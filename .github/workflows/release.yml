name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Tag matches the manifests
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in plugin.json package.json; do
            test "$(node -p "require('./$f').version")" = "$v" || { echo "$f is not $v"; exit 1; }
          done
          test "$(node -p "require('./.github/plugin/marketplace.json').metadata.version")" = "$v" || { echo "marketplace.json is not $v"; exit 1; }
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Marginal $GITHUB_REF_NAME" --notes-file notes.md --verify-tag